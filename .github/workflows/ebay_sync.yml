name: eBay Inventory Sync

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch: {}      # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write   # needed to commit data/ended_listings.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run inventory sync
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
          EBAY_USER_TOKEN_WHEELSTIRES: ${{ secrets.EBAY_USER_TOKEN_WHEELSTIRES }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python scripts/sync_ebay_inventory.py

      - name: Commit ended-listings state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ended_listings.json
          git diff --cached --quiet || git commit -m "Update ended-listings state [skip ci]"
          git push
